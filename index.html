<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK PREMIUM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 15% 25%, rgba(0, 170, 255, 0.15) 0%, transparent 5%), radial-gradient(circle at 85% 45%, rgba(255, 0, 85, 0.15) 0%, transparent 5%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px;
        }

        /* --- MÀN HÌNH LOGIN TỔNG --- */
        #login-screen { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin-top: 50px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #333; background: url('https://i.pinimg.com/736x/8a/e7/01/8ae701158b53a3c72bf1c0043f2b6cf5.jpg') center/cover; margin-bottom: 20px; position: relative; }
        .avatar::after { content: '+'; position: absolute; color: red; font-size: 20px; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.5; }
        .title { font-size: 22px; font-weight: 900; margin-bottom: 20px; color: #ddd; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 30px; color: white; text-align: center; margin-bottom: 15px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 15px; background: #007aff; color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 0 15px rgba(0, 122, 255, 0.4); }

        /* --- MÀN HÌNH MENU CHÍNH --- */
        #menu-screen { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .header-title { font-size: 28px; font-weight: 900; letter-spacing: 3px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        .card-container { width: 100%; background-color: #121212; border-radius: 20px; border: 1px solid #2a2a2a; padding: 10px 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .row-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #222; }
        .row-item:last-child { border-bottom: none; }
        .row-info { display: flex; align-items: center; gap: 15px; }
        .row-title { font-size: 15px; font-weight: 600; letter-spacing: 1px; }

        /* Nút Gạt */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #007aff; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Modal Nhập Key */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background-color: #1a1a1a; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; border: 1px solid #333; text-align: center; position: relative; }
        .modal-title { font-size: 20px; font-weight: 800; color: #007aff; margin-bottom: 10px; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; color: #888; cursor: pointer; }
    </style>
</head>
<body>

    <!-- MODAL NHẬP KEY -->
    <div id="modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeModal()">✕</span>
            <div class="modal-title" id="modal-title">YÊU CẦU KEY</div>
            <input type="text" id="modal-key-input" placeholder="Nhập Key cấu hình...">
            <button onclick="verifyConfig()">TẢI CẤU HÌNH</button>
        </div>
    </div>

    <!-- MÀN HÌNH 1: LOGIN TỔNG -->
    <div id="login-screen">
        <div class="avatar"></div>
        <div class="title">KEY LOGIN</div>
        <input type="text" id="main-key" placeholder="Nhập Key tổng...">
        <button onclick="login()">LOGIN</button>
    </div>

    <!-- MÀN HÌNH 2: MENU -->
    <div id="menu-screen">
        <div class="header-title">HEADLOCK</div>
        <div class="card-container">
            <div class="row-item">
                <div class="row-info"><span>💀</span><span class="row-title">HEADLOCK V1</span></div>
                <label class="switch"><input type="checkbox" onchange="openModal('V1', this)"><span class="slider"></span></label>
            </div>
            <div class="row-item">
                <div class="row-info"><span>💀</span><span class="row-title">HEADLOCK V2</span></div>
                <label class="switch"><input type="checkbox" onchange="openModal('V2', this)"><span class="slider"></span></label>
            </div>
            <div class="row-item">
                <div class="row-info"><span>💀</span><span class="row-title">HEADLOCK V3</span></div>
                <label class="switch"><input type="checkbox" onchange="openModal('V3', this)"><span class="slider"></span></label>
            </div>
            <div class="row-item">
                <div class="row-info"><span>💀</span><span class="row-title">HEADLOCK V4</span></div>
                <label class="switch"><input type="checkbox" onchange="openModal('V4', this)"><span class="slider"></span></label>
            </div>
            <div class="row-item">
                <div class="row-info"><span>💀</span><span class="row-title">HEADLOCK V5</span></div>
                <label class="switch"><input type="checkbox" onchange="openModal('V5', this)"><span class="slider"></span></label>
            </div>
        </div>
    </div>

    <script>
        // 1. CẤU HÌNH KEY VÀ TRẠNG THÁI
        const MAIN_KEY = "12865391-981628-id";
        const KEYS = { "V1": "128910-179929", "V2": "163781-18298", "V3": "193619-19278", "V4": "81737-71738", "V5": "19361929" };
        let currentVer = null, currentSwitch = null;

        // 2. LOGIC ĐĂNG NHẬP
        function login() {
            if (document.getElementById('main-key').value.trim() === MAIN_KEY) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('menu-screen').style.display = 'flex';
            } else { alert("Sai Key tổng!"); }
        }

        // 3. LOGIC MỞ MODAL
        function openModal(version, checkbox) {
            if (checkbox.checked) {
                currentVer = version; currentSwitch = checkbox;
                document.getElementById('modal-title').innerText = `HEADLOCK ${version}`;
                document.getElementById('modal-key-input').value = '';
                document.getElementById('modal').style.display = 'flex';
            }
        }
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            if (currentSwitch) { currentSwitch.checked = false; currentSwitch = null; }
        }

        // 4. XÁC NHẬN KEY VÀ TẢI
        function verifyConfig() {
            if (document.getElementById('modal-key-input').value.trim() === KEYS[currentVer]) {
                document.getElementById('modal').style.display = 'none';
                downloadConfig(currentVer);
            } else { alert("Sai Key cấu hình!"); }
        }

        // 5. HÀM TẠO FILE (ĐÃ GỘP TOUCH + GESTURE)
        function downloadConfig(version) {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <array>
        <!-- CẢM ỨNG (TOUCH) -->
        <dict>
            <key>PayloadType</key><string>com.apple.Accessibility</string>
            <key>PayloadVersion</key><integer>1</integer>
            <key>PayloadIdentifier</key><string>com.ultimate.touch</string>
            <key>PayloadUUID</key><string>F1A2B3C4-D5E6-4F7A-8B9C-0D1E2F3A4B5C</string>
            <key>PayloadDisplayName</key><string>Touch</string>
            <key>TouchAccommodations</key>
            <dict>
                <key>Enabled</key><true/>
                <key>HoldDuration</key><real>1.25</real>
                <key>TapTimeout</key><real>2.00</real>
                <key>IgnoreRepeat</key><true/>
                <key>TapAssistance</key><string>FollowFinger</string>
                <key>GlideSpeed</key><string>InstantLock</string>
                <key>PointerPrecision</key><string>Maximum</string>
            </dict>
        </dict>
        <!-- VUỐT / BÁM ĐẦU (GESTURE) -->
        <dict>
            <key>PayloadType</key><string>com.apple.unknown.data</string>
            <key>PayloadVersion</key><integer>1</integer>
            <key>PayloadIdentifier</key><string>com.ultimate.gesture.${version}</string>
            <key>PayloadUUID</key><string>D0000000-1111-2222-3333-444444444444</string>
            <key>PayloadDisplayName</key><string>Gesture Simulation</string>
            <key>GestureSimulation</key>
            <dict>
                <key>Enabled</key><true/>
                <key>Mode</key><string>ultimate_head_lock</string>
                <key>TargetLock</key><string>head_100_percent</string>
                <key>ChestLockDisable</key><true/>
                <key>HeadLockPriority</key><integer>100</integer>
                <key>ForceHeadValue</key><integer>100</integer>
                <key>SwipeAcceleration</key><integer>0</integer>
                <key>OvershootProtection</key><true/>
                <key>JitterReduction</key><true/>
                <key>DragPower</key><real>0.001</real>
                <key>AimDragSpeed</key><real>5.0</real>
                <key>SwipeSpeed</key><real>45.0</real>
                <key>SwipeSmoothing</key><integer>5</integer>
                <key>TouchZone</key><string>RightEdge</string>
                <key>CornerPrecision</key><integer>300</integer>
                <key>MagneticPull</key><true/>
                <key>StickyAim</key><true/>
                <key>SnapRadius</key><integer>800</integer>
                <key>SnapStrength</key><integer>100</integer>
            </dict>
        </dict>
        <!-- DNS -->
        <dict>
            <key>PayloadType</key><string>com.apple.dnsSettings.managed</string>
            <key>PayloadVersion</key><integer>1</integer>
            <key>PayloadIdentifier</key><string>com.ultimate.dns</string>
            <key>PayloadUUID</key><string>C3D4E5F6-A7B8-4C9D-0E1F-2A3B4C5D6E7F</string>
            <key>PayloadDisplayName</key><string>DNS</string>
            <key>DNSSettings</key>
            <dict><key>DNSProtocol</key><string>HTTPS</string><key>ServerURL</key><string>https://cloudflare-dns.com/dns-query</string></dict>
        </dict>
    </array>
    <key>PayloadDisplayName</key><string>Headlock ${version}</string>
    <key>PayloadIdentifier</key><string>com.ultimate.${version}</string>
    <key>PayloadType</key><string>Configuration</string>
    <key>PayloadUUID</key><string>A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C5D</string>
    <key>PayloadVersion</key><integer>1</integer>
</dict>
</plist>`;

            let blob = new Blob([xml], { type: 'application/x-apple-aspen-config' });
            let a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = `Headlock_${version}.mobileconfig`; 
            a.click();
            alert(`Đã tải cấu hình ${version} thành công!\nHãy vào Cài đặt > Đã tải xuống > Cài đặt.`);
        }
    </script>
</body>
</html>
