<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEADLOCK MENU</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 15% 25%, rgba(0, 170, 255, 0.15) 0%, transparent 5%), radial-gradient(circle at 85% 45%, rgba(255, 0, 85, 0.15) 0%, transparent 5%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px;
        }

        #menu-screen { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin-top: 20px; margin-bottom: 50px; }
        .header-title { font-size: 28px; font-weight: 900; margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 0, 0, 0.4); }
        
        .main-card { 
            width: 100%; background-color: #121212; border-radius: 20px; border: 1px solid #2a2a2a; padding: 10px 20px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .row-item { display: flex; justify-content: space-between; align-items: center; padding: 18px 0; border-bottom: 1px solid #222; }
        .row-item:last-child { border-bottom: none; }
        .row-info { display: flex; align-items: center; gap: 15px; }
        .row-icon { font-size: 18px; }
        .row-title { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
        
        /* Nút gạt tròn */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff0033; } 
        input:checked + .slider:before { transform: translateX(22px); }

        /* Nút Tăng Tốc (Dạng chữ bấm vào) */
        .btn-speed {
            background-color: #ff0033; color: white; border: none; padding: 8px 15px; border-radius: 10px;
            font-size: 12px; font-weight: 800; cursor: pointer; box-shadow: 0 0 10px rgba(255,0,51,0.4);
        }
        .btn-speed:active { transform: scale(0.95); }

        /* Thanh ON/OFF */
        .starting-text { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #888; margin-bottom: 15px; text-transform: uppercase; align-self: flex-start; }
        .on-off-container { width: 100%; display: flex; border-radius: 15px; overflow: hidden; border: 1px solid #333; margin-bottom: 20px; }
        .btn-on, .btn-off { flex: 1; padding: 18px; text-align: center; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-on { background-color: #555; color: white; }
        .btn-off { background-color: #ff0000; color: white; }
        .btn-on.active { background-color: #00ff88; color: black; }

        /* --- POPUP TĂNG TỐC --- */
        #speed-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background-color: #1a1a1a; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #333; position: relative; }
        .modal-title { font-size: 20px; font-weight: 800; color: #ff0033; margin-bottom: 15px; }
        .modal-box input { width: 100%; padding: 15px; background: #050505; border: 1px solid #333; border-radius: 10px; color: white; text-align: center; margin-bottom: 15px; font-size: 18px; outline: none; font-weight: bold; }
        .modal-box button { width: 100%; padding: 15px; background: #ff0033; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #888; }

    </style>
</head>
<body>

    <!-- Popup Nhập Tốc Độ -->
    <div id="speed-modal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeSpeedModal()">✕</span>
            <div class="modal-title">TĂNG TỐC BẮN</div>
            <input type="number" id="speed-input" placeholder="Nhập tốc độ (VD: 100)...">
            <button onclick="applySpeed()">ÁP DỤNG</button>
        </div>
    </div>

    <div id="menu-screen">
        <div class="header-title">HEADLOCK</div>
        
        <!-- KHỐI 1: CÁC NÚT CƠ BẢN CŨ -->
        <div class="main-card">
            <div class="row-item"><div class="row-info"><span class="row-icon">🎯</span><span class="row-title">REG FILES</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            <div class="row-item"><div class="row-info"><span class="row-icon">🚀</span><span class="row-title">BOST RAM</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            <div class="row-item"><div class="row-info"><span class="row-icon">💀</span><span class="row-title">HEADLOCK</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            <div class="row-item"><div class="row-info"><span class="row-icon">⚙️</span><span class="row-title">FIX RUNG</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
        </div>

        <!-- KHỐI 2: CÁC NÚT MỚI THÊM -->
        <div class="main-card">
            <div class="row-item"><div class="row-info"><span class="row-icon">🎯</span><span class="row-title">Smooth Lock</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            <div class="row-item"><div class="row-info"><span class="row-icon">🔒</span><span class="row-title">Reglock</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            <div class="row-item"><div class="row-info"><span class="row-icon">🪶</span><span class="row-title">Nhẹ Tâm</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            <div class="row-item"><div class="row-info"><span class="row-icon">💀</span><span class="row-title">Bám Đầu</span></div><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
            
            <!-- Nút Tăng Tốc (Mở Popup) -->
            <div class="row-item">
                <div class="row-info"><span class="row-icon">⚡</span><span class="row-title">Tăng Tốc Nút Bắn</span></div>
                <button class="btn-speed" onclick="openSpeedModal()">NHẬP</button>
            </div>
        </div>

        <!-- KHỐI 3: THANH ON/OFF -->
        <div class="starting-text">STARTING FILES</div>
        <div class="on-off-container">
            <div class="btn-on active" id="btn-on" onclick="toggleStart('on')">ON</div>
            <div class="btn-off" id="btn-off" onclick="toggleStart('off')">OFF</div>
        </div>
    </div>

    <script>
        // 1. Logic bật/tắt thanh ON/OFF
        function toggleStart(status) {
            const btnOn = document.getElementById('btn-on');
            const btnOff = document.getElementById('btn-off');
            if (status === 'on') {
                btnOn.classList.add('active'); btnOn.style.backgroundColor = '#00ff88'; btnOn.style.color = '#000';
                btnOff.classList.remove('active'); btnOff.style.backgroundColor = '#555';
            } else {
                btnOff.classList.add('active'); btnOff.style.backgroundColor = '#ff0000';
                btnOn.classList.remove('active'); btnOn.style.backgroundColor = '#333';
            }
        }

        // 2. Logic Popup Tăng Tốc
        function openSpeedModal() {
            document.getElementById('speed-input').value = ''; // Xóa ô nhập cũ
            document.getElementById('speed-modal').style.display = 'flex';
        }

        function closeSpeedModal() {
            document.getElementById('speed-modal').style.display = 'none';
        }

        function applySpeed() {
            const speedValue = document.getElementById('speed-input').value;
            if (speedValue.trim() === "") {
                alert("Vui lòng nhập số tốc độ!");
                return;
            }
            
            // Hiển thị thông báo thành công
            alert(`Áp dụng thành công tốc độ: ${speedValue}`);
            
            // Đóng bảng
            closeSpeedModal();
        }
    </script>
</body>
</html>
