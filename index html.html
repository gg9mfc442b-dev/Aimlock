<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Mod FF MAX - Cấu hình DDC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #001a33; 
            background-image: radial-gradient(circle at top, #004488 0%, #001a33 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            transition: filter 0.3s ease; 
        }

        body.boost-active {
            filter: brightness(1.3) contrast(1.1);
        }

        .top-nav {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: linear-gradient(to bottom, #001a33 70%, transparent);
            z-index: 100;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #003366;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: #fff;
            border: 1px solid #0055aa;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            color: #00d4ff;
        }

        .section-container {
            width: 90%;
            max-width: 400px;
            margin-top: 20px;
            border-radius: 16px;
            padding: 20px;
            background-color: #002244; 
            position: relative;
            border: 1px solid #00aaff;
            box-shadow: 0 0 15px rgba(0, 170, 255, 0.3), inset 0 0 10px rgba(0, 170, 255, 0.1);
        }

        .section-title {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
            margin-bottom: 5px;
        }

        .section-subtitle {
            text-align: center;
            font-size: 12px;
            color: #7a9fb6;
            margin-bottom: 20px;
        }

        .divider {
            height: 1px;
            width: 100%;
            background: linear-gradient(to right, transparent, #0055aa, transparent);
            margin-bottom: 20px;
        }

        .toggle-row {
            background-color: #002b55; 
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #00aaff;
            transition: all 0.3s;
        }

        .row-info { display: flex; flex-direction: column; }

        .row-title {
            font-size: 15px;
            font-weight: 700;
            color: #e0f0ff;
            margin-bottom: 3px;
        }
        
        .row-title.special-perm { color: #00ffff; }
        .row-title.special-boost { color: #ffcc00; }

        .row-desc { font-size: 11px; color: #6a9aba; }

        .pill-toggle {
            background-color: #003366;
            color: #5a8aa8;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .theme-blue .pill-toggle.active {
            background-color: rgba(0, 170, 255, 0.2);
            color: #00aaff;
            border-color: #00aaff;
            box-shadow: 0 0 8px rgba(0, 170, 255, 0.4);
        }
        
        .pill-toggle.active.perm-active {
            background-color: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            border-color: #00ffff;
        }

        .pill-toggle.active.boost-active {
            background-color: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
            border-color: #ffcc00;
        }

        .btn-apply {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
            background-color: transparent;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            border: 1px solid #00aaff;
            color: #00aaff;
        }

    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-btn">☰</div>
        <div class="nav-title">menu <span>⌄</span></div>
        <div class="nav-btn">✕</div>
    </div>

    <div class="section-container theme-blue">
        <div class="section-title">FREE FIRE MAX</div>
        <div class="section-subtitle">Tải Cấu Hình Tự Động (DDC)</div>
        <div class="divider"></div>

        <!-- Aimlock -->
        <div class="toggle-row" onclick="togglePill(this, 'blue')">
            <div class="row-info">
                <div class="row-title">Aimlock</div>
                <div class="row-desc">Hold 0.25 - Tap 0.5</div>
            </div>
            <div class="pill-toggle active" onclick="downloadConfig(event, 'aimlock')">ON</div>
        </div>

        <!-- Nhẹ tâm -->
        <div class="toggle-row" onclick="togglePill(this, 'blue')">
            <div class="row-info">
                <div class="row-title">Nhẹ Tâm</div>
                <div class="row-desc">Hold 0.10 - Tap 0.58</div>
            </div>
            <div class="pill-toggle active" onclick="downloadConfig(event, 'nhetam')">ON</div>
        </div>

        <!-- Fix rung -->
        <div class="toggle-row" onclick="togglePill(this, 'blue')">
            <div class="row-info">
                <div class="row-title">Fix Rung</div>
                <div class="row-desc">Hold 1.25 - Tap 2.00</div>
            </div>
            <div class="pill-toggle active" onclick="downloadConfig(event, 'fixrung')">ON</div>
        </div>

        <!-- Tăng FPS (Chưa có cấu hình cụ thể, chỉ hiệu ứng) -->
        <div class="toggle-row" onclick="togglePill(this, 'blue')">
            <div class="row-info">
                <div class="row-title">Tăng FPS</div>
                <div class="row-desc">Tối ưu đồ họa, giảm lag giật</div>
            </div>
            <div class="pill-toggle active">ON</div>
        </div>
        
        <!-- Boost Màn -->
        <div class="toggle-row" onclick="togglePill(this, 'boost')">
            <div class="row-info">
                <div class="row-title special-boost">Boost Màn</div>
                <div class="row-desc">Cấu hình tăng độ sáng</div>
            </div>
            <div class="pill-toggle active boost-active" onclick="downloadConfig(event, 'boost')">ON</div>
        </div>

        <!-- Cấp Quyền Tâm Đỏ -->
        <div class="toggle-row" onclick="togglePill(this, 'perm')">
            <div class="row-info">
                <div class="row-title special-perm">Cấp Quyền Tâm Đỏ</div>
                <div class="row-desc">Cấu hình can thiệp bộ nhớ</div>
            </div>
            <div class="pill-toggle active perm-active" onclick="downloadConfig(event, 'quyen')">ON</div>
        </div>

        <button class="btn-apply" onclick="applyConfig('https://apps.apple.com/app/id1480516829', this)">APPLY FF MAX</button>
    </div>

    <script>
        // Hàm xử lý đổi màu nút gạt (Chỉ hiệu ứng giao diện)
        function togglePill(rowElement, theme) {
            const pill = rowElement.querySelector('.pill-toggle');
            const body = document.body;
            
            if (pill.classList.contains('active')) {
                pill.classList.remove('active', 'perm-active', 'boost-active');
                pill.innerText = 'OFF';
                pill.style.cssText = '';
                if (theme === 'boost') body.classList.remove('boost-active');
            } else {
                pill.classList.add('active');
                if(theme === 'perm') pill.classList.add('perm-active');
                if(theme === 'boost') {
                    pill.classList.add('boost-active');
                    body.classList.add('boost-active'); 
                }
                pill.innerText = 'ON';
            }
        }

        // HÀM TẠO VÀ TẢI FILE CẤU HÌNH (.mobileconfig)
        function downloadConfig(event, type) {
            event.stopPropagation(); // Ngăn sự kiện click lan ra ngoài (không bị đè với hàm toggle)
            
            // Cấu hình mẫu chuẩn của Apple
            let plistXML = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <array>
        <dict>
            <key>PayloadType</key>
            <string>com.apple.Accessibility</string>
            <key>PayloadVersion</key>
            <integer>1</integer>
            <key>PayloadIdentifier</key>
            <string>com.mod.custom.touch</string>
            <key>PayloadUUID</key>
            <string>F1A2B3C4-D5E6-4F7A-8B9C-0D1E2F3A4B5C</string>
            <key>PayloadDisplayName</key>
            <string>Custom Touch Settings</string>
            <key>TouchAccommodations</key>
            <dict>
                <key>Enabled</key><true/>
                <key>HoldDuration</key><real>${getHoldTime(type)}</real> 
                <key>TapTimeout</key><real>${getTapTime(type)}</real> 
                <key>IgnoreRepeat</key><true/> 
            </dict>
        </dict>
    </array>
    <key>PayloadDisplayName</key>
    <string>Config ${type.toUpperCase()}</string>
    <key>PayloadIdentifier</key>
    <string>com.mod.config.${type}</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C5D</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
</dict>
</plist>`;

            // Tạo file và ép trình duyệt tải xuống
            const blob = new Blob([plistXML], { type: 'application/x-apple-aspen-config' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `config_${type}.mobileconfig`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Hiển thị thông báo hướng dẫn
            setTimeout(() => {
                alert("Đã tải xuống cấu hình. Vui lòng vào Cài đặt (Settings) > Đã tải xuống (Profile Downloaded) > Cài đặt (Install) để áp dụng.");
            }, 500);
        }

        // Hàm lấy thông số Hold Duration theo yêu cầu
        function getHoldTime(type) {
            switch(type) {
                case 'aimlock': return '0.25';
                case 'nhetam': return '0.10';
                case 'fixrung': return '1.25';
                case 'boost': return '0.10'; 
                case 'quyen': return '0.10';
                default: return '0.50';
            }
        }

        // Hàm lấy thông số Tap Timeout theo yêu cầu
        function getTapTime(type) {
            switch(type) {
                case 'aimlock': return '0.50';
                case 'nhetam': return '0.58';
                case 'fixrung': return '2.00';
                case 'boost': return '0.50';
                case 'quyen': return '0.50';
                default: return '1.00';
            }
        }

        // Hàm xử lý nút Apply (Mở App Store)
        function applyConfig(url, btnElement) {
            const originalText = btnElement.innerText;
            btnElement.innerText = "ĐANG ÁP DỤNG...";
            setTimeout(() => {
                btnElement.innerText = originalText;
                window.location.href = url; 
            }, 1000);
        }
    </script>
</body>
</html>
