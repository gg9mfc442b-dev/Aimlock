<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔥 UltraLock Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #0a0a0f 0%, #1a0a2e 50%, #0d0d1a 100%);
            min-height: 100vh; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            color: #fff;
        }
        .menu-container {
            background: rgba(20, 10, 40, 0.92);
            border-radius: 28px; padding: 24px 20px 30px;
            width: 100%; max-width: 420px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 50, 50, 0.25);
            box-shadow: 0 20px 60px rgba(255, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .header {
            text-align: center; margin-bottom: 24px;
            padding-bottom: 16px; border-bottom: 1px solid rgba(255, 50, 50, 0.15);
        }
        .header .icon { font-size: 44px; display: block; margin-bottom: 4px; }
        .header h1 {
            font-size: 22px; font-weight: 700;
            background: linear-gradient(90deg, #ff4444, #ff8800);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .sub { font-size: 11px; color: rgba(255, 255, 255, 0.4); letter-spacing: 2px; margin-top: 2px; }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.4); border-radius: 14px;
            padding: 10px 16px; margin-bottom: 20px; border-left: 3px solid #ff4444;
        }
        .status-bar .label { font-size: 12px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; letter-spacing: 1px; }
        .status-bar .value { font-size: 13px; font-weight: 600; color: #44ff88; }
        .menu-item {
            background: rgba(255, 255, 255, 0.04); border-radius: 16px;
            padding: 14px 18px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.25s ease;
        }
        .menu-item:active { transform: scale(0.97); background: rgba(255, 50, 50, 0.1); }
        .menu-item .info { display: flex; flex-direction: column; gap: 2px; }
        .menu-item .info .name { font-size: 15px; font-weight: 600; color: #eee; }
        .menu-item .info .desc { font-size: 11px; color: rgba(255, 255, 255, 0.35); }
        .switch {
            width: 48px; height: 28px; background: rgba(255, 255, 255, 0.1);
            border-radius: 14px; position: relative; cursor: pointer;
            transition: background 0.3s ease; flex-shrink: 0;
        }
        .switch.active { background: linear-gradient(90deg, #ff4444, #ff8800); }
        .switch .knob {
            width: 22px; height: 22px; background: #fff; border-radius: 50%;
            position: absolute; top: 3px; left: 3px; transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .switch.active .knob { left: 23px; }
        .slider-item {
            background: rgba(255, 255, 255, 0.04); border-radius: 16px;
            padding: 14px 18px; margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .slider-item .info { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .slider-item .info .name { font-size: 14px; font-weight: 600; color: #eee; }
        .slider-item .info .value { font-size: 14px; font-weight: 700; color: #ff8844; }
        input[type="range"] {
            -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
            border-radius: 2px; background: rgba(255, 255, 255, 0.15); outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: linear-gradient(135deg, #ff4444, #ff8800);
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        .footer {
            margin-top: 20px; text-align: center; font-size: 10px;
            color: rgba(255, 255, 255, 0.15); letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 16px;
        }
    </style>
</head>
<body>

<div class="menu-container">
    <div class="header">
        <span class="icon">🔥</span>
        <h1>UltraLock Pro</h1>
        <div class="sub">FREE FIRE · VIP EXCLUSIVE</div>
    </div>

    <div class="status-bar">
        <span class="label">📡 Trạng thái</span>
        <span class="value">● Đang hoạt động</span>
    </div>

    <div class="menu-item" onclick="toggleSwitch('aimbot')">
        <div class="info">
            <span class="name">🎯 AimLock</span>
            <span class="desc">Tự động bám đầu đối thủ</span>
        </div>
        <div class="switch active" id="switch-aimbot">
            <div class="knob"></div>
        </div>
    </div>

    <div class="menu-item" onclick="toggleSwitch('esp')">
        <div class="info">
            <span class="name">👁️ ESP</span>
            <span class="desc">Nhìn xuyên tường, hiển thị đối thủ</span>
        </div>
        <div class="switch active" id="switch-esp">
            <div class="knob"></div>
        </div>
    </div>

    <div class="menu-item" onclick="toggleSwitch('norecoil')">
        <div class="info">
            <span class="name">🔫 No Recoil</span>
            <span class="desc">Tắt giật khi bắn</span>
        </div>
        <div class="switch active" id="switch-norecoil">
            <div class="knob"></div>
        </div>
    </div>

    <div class="menu-item" onclick="toggleSwitch('autoshoot')">
        <div class="info">
            <span class="name">⚡ Auto Shoot</span>
            <span class="desc">Tự động bắn khi vào tầm</span>
        </div>
        <div class="switch" id="switch-autoshoot">
            <div class="knob"></div>
        </div>
    </div>

    <div class="slider-item">
        <div class="info">
            <span class="name">🎚️ Độ nhạy Aim</span>
            <span class="value" id="sensitivityValue">85</span>
        </div>
        <input type="range" min="1" max="100" value="85" id="sensitivitySlider" oninput="updateSensitivity(this.value)">
    </div>

    <div class="slider-item">
        <div class="info">
            <span class="name">📏 Tầm ESP</span>
            <span class="value" id="espRangeValue">150</span>
        </div>
        <input type="range" min="50" max="300" value="150" id="espRangeSlider" oninput="updateEspRange(this.value)">
    </div>

    <div class="footer">
        ● UltraLock Pro · VIP EXCLUSIVE ●
    </div>
</div>

<script>
    const config = {
        aimbot: true, esp: true, norecoil: true,
        autoshoot: false, sensitivity: 85, espRange: 150
    };

    function toggleSwitch(key) {
        config[key] = !config[key];
        const el = document.getElementById('switch-' + key);
        el.classList.toggle('active');
        localStorage.setItem('ultralock_config', JSON.stringify(config));
    }

    function updateSensitivity(val) {
        config.sensitivity = parseInt(val);
        document.getElementById('sensitivityValue').textContent = val;
        localStorage.setItem('ultralock_config', JSON.stringify(config));
    }

    function updateEspRange(val) {
        config.espRange = parseInt(val);
        document.getElementById('espRangeValue').textContent = val;
        localStorage.setItem('ultralock_config', JSON.stringify(config));
    }

    const saved = localStorage.getItem('ultralock_config');
    if (saved) {
        try {
            const p = JSON.parse(saved);
            Object.assign(config, p);
            for (const key of ['aimbot', 'esp', 'norecoil', 'autoshoot']) {
                const el = document.getElementById('switch-' + key);
                if (config[key]) el.classList.add('active');
                else el.classList.remove('active');
            }
            document.getElementById('sensitivitySlider').value = config.sensitivity;
            document.getElementById('sensitivityValue').textContent = config.sensitivity;
            document.getElementById('espRangeSlider').value = config.espRange;
            document.getElementById('espRangeValue').textContent = config.espRange;
        } catch(e) {}
    }
</script>

</body>
</html>
